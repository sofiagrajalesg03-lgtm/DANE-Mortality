# Netlify publica solo la carpeta del dashboard (no hay paso de build: los datos ya están
# procesados en dashboard/data/ y las librerías están en dashboard/vendor/).
[build]
  publish = "dashboard"

# Cabeceras de seguridad básicas para todo el sitio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Los datos cambian pocas veces: el navegador puede reutilizarlos 1 hora.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
